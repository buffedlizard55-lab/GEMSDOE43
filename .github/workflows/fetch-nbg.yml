name: Verify official USGS NGB source

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7bd177bc-gemsdoe43
    paths:
      - .github/workflows/fetch-nbg.yml
      - scripts/inspect_ngb.py
      - src/gemsdoe43/geochem.py
      - requirements.txt

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the registered code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fetch the official USGS CSV over verified HTTPS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p intake
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --output intake/ngb.csv \
            https://pubs.usgs.gov/of/2002/0227/ngb.csv
          test "$(wc -c < intake/ngb.csv)" -gt 1000000
          sha256sum intake/ngb.csv
      - name: Restore and checksum the owner-mirrored footprint template
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            --output intake/sample_submission.tif \
            https://raw.githubusercontent.com/buffedlizard55-lab/GEMSDOE24/07345ea0604953d7efb858d9cfbc21e20c7aca0b/data/bridge/sample_submission.tif
          echo '2176d08e485aa2cd2860ce8df539db4faf4d76163b38a4dd8c30a40454d35cbc  intake/sample_submission.tif' | sha256sum --check
      - name: Count source records, quality flags and footprint coverage (no labels read)
        run: python scripts/inspect_ngb.py --csv intake/ngb.csv --template intake/sample_submission.tif --out evidence/data_source_audit.json
      - name: Publish the compact, reproducible audit as this workflow check summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const job = data.jobs.find(j => j.name === 'verify-source');
            if (!job) throw new Error('Could not locate source-audit check run');
            const p = 'evidence/data_source_audit.json';
            const audit = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'Audit JSON was not created; inspect the preceding workflow steps.';
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo, check_run_id: job.id,
              output: { title: 'Official USGS NGB source/coverage audit', summary: '```json\n' + audit.slice(0, 50000) + '\n```' }
            });
