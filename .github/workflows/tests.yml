name: Test and compile

on:
  push:
    branches:
      - arena/7bd177bc-gemsdoe43
    paths:
      - .github/workflows/tests.yml
      - requirements.txt
      - src/**
      - scripts/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/tests.yml
      - requirements.txt
      - src/**
      - scripts/**
      - tests/**

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the registered code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run synthetic and format tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Compile source and scripts
        run: python -m compileall -q src scripts tests
      - name: Check whitespace errors
        run: git diff --check
