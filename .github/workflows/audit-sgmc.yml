name: Audit official USGS SGMC source

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7bd177bc-gemsdoe43
    paths:
      - .github/workflows/audit-sgmc.yml
      - scripts/inspect_sgmc.py
      - src/gemsdoe43/geology.py
      - requirements.txt

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the registered code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fetch official California, Nevada and SGMC attribute-table archives over verified HTTPS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p intake
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
            --output intake/CA.zip \
            https://mrdata.usgs.gov/geology/state/shp/CA.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
            --output intake/NV.zip \
            https://mrdata.usgs.gov/geology/state/shp/NV.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
            --output intake/USGS_SGMC_Tables_CSV.zip \
            'https://www.sciencebase.gov/catalog/file/get/5888bf4fe4b05ccb964bab9d?name=USGS_SGMC_Tables_CSV.zip'
          file intake/CA.zip intake/NV.zip intake/USGS_SGMC_Tables_CSV.zip
          sha256sum intake/CA.zip intake/NV.zip intake/USGS_SGMC_Tables_CSV.zip
      - name: Restore and checksum the owner-mirrored grid and footprint template
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            --output intake/sample_submission.tif \
            https://raw.githubusercontent.com/buffedlizard55-lab/GEMSDOE24/07345ea0604953d7efb858d9cfbc21e20c7aca0b/data/bridge/sample_submission.tif
          echo '2176d08e485aa2cd2860ce8df539db4faf4d76163b38a4dd8c30a40454d35cbc  intake/sample_submission.tif' | sha256sum --check
      - name: Audit polygon coverage and required classes (no labels read)
        run: python scripts/inspect_sgmc.py --ca-zip intake/CA.zip --nv-zip intake/NV.zip --tables-zip intake/USGS_SGMC_Tables_CSV.zip --template intake/sample_submission.tif --out evidence/sgmc_source_audit.json
      - name: Publish compact source-audit results as this workflow check summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const job = data.jobs.find(j => j.name === 'audit-source');
            if (!job) throw new Error('Could not locate SGMC source-audit check run');
            const p = 'evidence/sgmc_source_audit.json';
            const audit = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'Audit JSON was not created; inspect the preceding workflow steps.';
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo, check_run_id: job.id,
              output: { title: 'Official USGS SGMC source/schema/coverage audit', summary: '```json\n' + audit.slice(0, 50000) + '\n```' }
            });
